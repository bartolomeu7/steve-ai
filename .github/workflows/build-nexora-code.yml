name: Build NEXORA CODE source pack

on:
  push:
    branches:
      - nexora-code-build-20260921

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Fetch pinned Jan and Pixelbot sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jan /tmp/pixelbot
          git init /tmp/jan
          git -C /tmp/jan remote add origin https://github.com/janhq/jan.git
          git -C /tmp/jan fetch --depth=1 --filter=blob:none origin 68b9ceeeb3fd213766c7625f01d3e9b2af9ecb99
          git -C /tmp/jan checkout --detach FETCH_HEAD
          git -C /tmp/jan sparse-checkout init --cone
          git -C /tmp/jan sparse-checkout set web-app core extensions src-tauri scripts package.json yarn.lock .yarnrc.yml Makefile LICENSE README.md vitest.config.ts .prettierignore .prettierrc
          git init /tmp/pixelbot
          git -C /tmp/pixelbot remote add origin https://github.com/pixeltable/pixelbot.git
          git -C /tmp/pixelbot fetch --depth=1 --filter=blob:none origin 28bb68523a9eee072a94ca64fdef02c324a09e21
          git -C /tmp/pixelbot checkout --detach FETCH_HEAD
          git -C /tmp/pixelbot sparse-checkout init --cone
          git -C /tmp/pixelbot sparse-checkout set backend frontend LICENSE README.md DESIGN.md AGENTS.md .env.example

      - name: Assemble NEXORA CODE pack
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/stage/NEXORA CODE"
          mkdir -p "$ROOT/source/jan"
          mkdir -p "$ROOT/source/pixelbot"

          rsync -a --delete --exclude='.git/' /tmp/jan/web-app/ "$ROOT/source/jan/web-app/"
          rsync -a --delete --exclude='.git/' /tmp/jan/core/ "$ROOT/source/jan/core/"
          rsync -a --delete --exclude='.git/' /tmp/jan/extensions/ "$ROOT/source/jan/extensions/"
          rsync -a --delete --exclude='.git/' /tmp/jan/src-tauri/ "$ROOT/source/jan/src-tauri/"
          rsync -a --delete --exclude='.git/' /tmp/jan/scripts/ "$ROOT/source/jan/scripts/"
          for f in package.json yarn.lock .yarnrc.yml Makefile LICENSE README.md vitest.config.ts .prettierignore .prettierrc; do
            cp "/tmp/jan/$f" "$ROOT/source/jan/$f"
          done

          rsync -a --delete --exclude='.git/' /tmp/pixelbot/backend/ "$ROOT/source/pixelbot/backend/"
          rsync -a --delete --exclude='.git/' /tmp/pixelbot/frontend/ "$ROOT/source/pixelbot/frontend/"
          cp /tmp/pixelbot/LICENSE "$ROOT/source/pixelbot/LICENSE"
          cp /tmp/pixelbot/README.md "$ROOT/source/pixelbot/README.md"
          cp /tmp/pixelbot/DESIGN.md "$ROOT/source/pixelbot/DESIGN.md"
          cp /tmp/pixelbot/AGENTS.md "$ROOT/source/pixelbot/AGENTS.md"
          cp /tmp/pixelbot/.env.example "$ROOT/source/pixelbot/.env.example"

          cat > "$ROOT/NEXORA_CODE_SOURCE_PACK.md" <<'EOF'
          # NEXORA CODE — source pack

          NEXORA CODE uses the Jan desktop application as the primary application/interface base.
          Pixelbot is included as a preserved upstream source/reference layer for UI patterns and multimodal/history/memory interaction work.

          This pack contains the actual upstream source snapshots at pinned commits.

          ## Pinned sources
          - Jan: https://github.com/janhq/jan
            Commit: 68b9ceeeb3fd213766c7625f01d3e9b2af9ecb99
          - Pixelbot: https://github.com/pixeltable/pixelbot
            Commit: 28bb68523a9eee072a94ca64fdef02c324a09e21

          ## Primary interface
          - Jan web-app/ is the primary desktop interface source.

          ## Native/runtime
          - Jan core/, extensions/, and src-tauri/ are preserved so the interface remains attached to the real desktop runtime architecture.

          ## Pixelbot
          - Pixelbot frontend/ and backend/ are included as upstream source.

          ## Licensing
          - Jan is Apache-2.0.
          - Pixelbot is Apache-2.0.
          - Preserve the upstream LICENSE files and attribution notices when redistributing/adapting this pack.
          EOF

          cat > "$ROOT/REUSE_MANIFEST.md" <<'EOF'
          # NEXORA CODE — reuse manifest

          ## Base
          Jan is the primary desktop application/interface base.

          ## Reused
          - Jan web-app/
          - Jan core/
          - Jan extensions/
          - Jan src-tauri/
          - Jan build metadata required by those components
          - Pixelbot frontend/
          - Pixelbot backend/
          - Pixelbot project documentation/metadata retained for provenance

          ## Integration rule
          Pixelbot is retained as upstream source/reference; it is not presented as if it were originally authored by NEXORA CODE.
          EOF

          cat > "$ROOT/ATTRIBUTION.md" <<'EOF'
          # Attribution

          NEXORA CODE includes source from:

          - Jan — Apache License 2.0 — Copyright Menlo Research.
            https://github.com/janhq/jan
          - Pixelbot — Apache License 2.0.
            https://github.com/pixeltable/pixelbot

          See the corresponding LICENSE files under source/jan/ and source/pixelbot/.
          EOF

          git -C /tmp/jan rev-parse HEAD > "$ROOT/source/jan/COMMIT_SHA"
          git -C /tmp/pixelbot rev-parse HEAD > "$ROOT/source/pixelbot/COMMIT_SHA"

          cd "$GITHUB_WORKSPACE/stage"
          zip -qr "$GITHUB_WORKSPACE/NEXORA-CODE-source-pack.zip" "NEXORA CODE"

      - name: Publish source pack
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-CODE-source-pack
          path: NEXORA-CODE-source-pack.zip
          if-no-files-found: error
          retention-days: 7
